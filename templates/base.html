<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Surveillance{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; }
        .navbar {
            background: #1a237e; color: white; padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .navbar h1 { font-size: 20px; }
        .navbar .links a {
            color: #cfd8ff; text-decoration: none; margin-left: 25px; font-size: 15px;
            padding: 6px 14px; border-radius: 4px; transition: 0.3s;
        }
        .navbar .links a:hover, .navbar .links a.active {
            background: #3949ab; color: white;
        }
        .container { padding: 25px 30px; }
        .card {
            background: white; border-radius: 8px; padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        .card h2 { font-size: 17px; color: #1a237e; margin-bottom: 12px; }
        .stats-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-box {
            flex: 1; min-width: 120px; background: white; border-radius: 8px;
            padding: 18px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .stat-box .number { font-size: 28px; font-weight: bold; color: #1a237e; }
        .stat-box .label { font-size: 13px; color: #666; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        th { background: #f5f5f5; color: #333; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-match { background: #ffcdd2; color: #c62828; }
        .badge-unknown { background: #c8e6c9; color: #2e7d32; }
        .badge-suspicious { background: #ffeb3b; color: #333; }
        .video { width: 100%; max-width: 720px; display: block; margin: 0 auto;
                 border-radius: 8px; background: #000; }
        .status-on { color: #2e7d32; font-weight: bold; }
        .status-off { color: #c62828; font-weight: bold; }
        .grid-images { display: flex; flex-wrap: wrap; gap: 12px; }
        .grid-images img { width: 130px; height: 130px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Smart Surveillance System</h1>
        <div class="links">
            <a href="/" class="{{ 'active' if active == 'home' else '' }}">Live Feed</a>
            <a href="/alerts" class="{{ 'active' if active == 'alerts' else '' }}">Alerts</a>
            <a href="/known_faces" class="{{ 'active' if active == 'faces' else '' }}">Known Faces</a>
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
